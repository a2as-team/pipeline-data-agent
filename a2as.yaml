manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: biplovbhandari/pipeline-data-agent
    source: https://github.com/biplovbhandari/pipeline-data-agent
    branch: main
    commit: "e178fb98"
    scope: [pipeline_data_agent/__init__.py, pipeline_data_agent/pattern_tools.py, pipeline_data_agent/anomaly_tools.py, pipeline_data_agent/utils/data_access.py,
      pipeline_data_agent/agent.py, pipeline_data_agent/prompts.py, pipeline_data_agent/retrieval_tools.py, pipeline_data_agent/utils/data_downloader.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:43:48Z'
    url: https://a2as.org/certified/agents/biplovbhandari/pipeline-data-agent
  signatures:
    digest: sha256:N5v3ZOE7Iia16sncXmG4jtN-LW99IXZK_4UGRckD7ls
    key: ed25519:bGcUfDURe5IXvEacPYKvvf8xlNFE1Ham9H4jiwx7y5E
    sig: ed25519:qjCg-9TNhZCBnm0eWOU9YnTywydXXVVE8ipJuGrQqiGfzRyJZt5iu1ncqZU923JkcCNEWgZfbL2PVhYXFnvhBw

agents:
  root_agent:
    type: instance
    models: [LLM_MODEL]
    tools: [get_dataset_info, query_total_volume, count_unique_pipelines, find_top_state_by_activity, get_top_pipelines_by_volume,
      calculate_average_quantity, analyze_receipts_vs_deliveries, detect_anomalies_simple, detect_business_rule_violations,
      detect_data_completeness_issues, detect_entity_duplicates_across_dimensions, analyze_seasonal_patterns, analyze_monthly_trends,
      find_consistent_pipelines, analyze_receipts_deliveries_patterns, analyze_activity_over_time, calculate_net_flows, get_top_locations_by_metric,
      aggregate_by_multiple_dimensions, filter_and_rank, analyze_time_series, compare_across_years, calculate_correlation,
      compare_before_after, perform_clustering]
    params:
      name: pipeline_data_agent
      instruction: AGENT_INSTRUCTION.format(today=date_today)
      global_instruction: ['You are a pipeline data analysis expert. Today''s date: {date_today}']
      before_agent_callback: setup_before_agent_call
      generate_content_config:
        class: GenerateContentConfig
        temperature: "0.1"

models:
  LLM_MODEL:
    type: literal
    agents: [root_agent]

tools:
  aggregate_by_multiple_dimensions:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Aggregate data by multiple dimensions with time grouping.

        Args:
            year: Year to analyze
            group_columns: List of columns to group by
            time_period: 'monthly', 'quarterly', or 'weekly'
            metric: 'sum', 'mean', 'count'
  analyze_activity_over_time:
    type: function
    agents: [root_agent]
    params:
      description: Analyze how pipeline activity has changed over time (always deduplicated for accuracy).
  analyze_monthly_trends:
    type: function
    agents: [root_agent]
    params:
      description: Analyze monthly trends in pipeline operations (always deduplicated for accuracy).
  analyze_receipts_deliveries_patterns:
    type: function
    agents: [root_agent]
    params:
      description: Analyze if receipts and deliveries follow similar patterns (always deduplicated for accuracy).
  analyze_receipts_vs_deliveries:
    type: function
    agents: [root_agent]
    params:
      description: Analyze receipts vs deliveries in the dataset.
  analyze_seasonal_patterns:
    type: function
    agents: [root_agent]
    params:
      description: Analyze seasonal patterns in gas flows (always deduplicated for accuracy).
  analyze_time_series:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Analyze time series data with specified granularity (always deduplicated for accuracy).

        Args:
            filters: Dictionary of filters to apply
            time_granularity: Time grouping ('daily', 'weekly', 'monthly', etc.)
            metric: Metric to analyze ('sum', 'mean', 'count')
  calculate_average_quantity:
    type: function
    agents: [root_agent]
    params:
      description: Calculate average scheduled quantity per transaction (always deduplicated for accuracy).
  calculate_correlation:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Calculate correlation between two metrics over time (always deduplicated for accuracy).

        Args:
            x_metric: First metric ('volume', 'active_locations', 'transaction_count', 'unique_pipelines')
            y_metric: Second metric ('volume', 'active_locations', 'transaction_count', 'unique_pipelines')
            time_granularity: Time grouping ('daily', 'weekly', 'monthly', 'quarterly')
            filters: Optional filters to apply (year, state, category, transaction_type, etc.)
  calculate_net_flows:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Calculate net flows grouped by specified column for a given year (always deduplicated for accuracy).

        Args:
            year: Year to analyze
            group_by_column: Column to group by ('pipeline_name', 'state_abb', etc.)
  compare_across_years:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Compare metrics across multiple years with year-over-year analysis (always deduplicated for accuracy).

        Args:
            start_year: Starting year for comparison
            end_year: Ending year for comparison
            group_by_column: Column to group by
            metric: Metric to compare
  compare_before_after:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Compare metrics before and after a cutoff date (always deduplicated for accuracy).

        Args:
            cutoff_date: Date in YYYY-MM-DD format to split the analysis
            metric: Metric to compare ('volume', 'transaction_count', 'unique_locations', 'average_quantity')
            time_granularity: Time grouping ('daily', 'weekly', 'monthly')
            filters: Filters to apply (pipeline, state, category, transaction_type, etc.)
  count_unique_pipelines:
    type: function
    agents: [root_agent]
    params:
      description: Count unique pipelines in the dataset.
  detect_anomalies_simple:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Detect anomalies using various methods with flexible LLM-orchestrated parameters.

        Args:
            method: 'zscore', 'rolling', 'change', 'percentile'
            filters: Dictionary of filters to apply (year, state, etc.)
            group_by_column: Column to group by ('loc_name', 'connecting_entity', 'pipeline_name', 'total')
            rolling_days: Number of days for window (e.g., 90, 20, 30)
            std_threshold: Threshold for detection (std devs, percentile, change %)
            max_examples: Maximum number of examples to return
  detect_business_rule_violations:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Detect business rule violations by checking if a category is acting contrary to expected direction.

        Args:
            category: Category to check (e.g., 'Production', 'LDC', 'Industrial', 'Storage')
            expected_direction: Expected transaction direction ('receipts' or 'deliveries')
            filters: Dictionary of additional filters to apply (year, state, etc.)
            max_examples: Maximum number of violation examples to return

        Examples:
            - category='Production', expected_direction='receipts' → finds Production acting as deliveries
            - category='LDC', expected_direction='deliveries' → finds LDC acting as receipts
            - category='Industrial', expected_direction='deliveries' → finds Industrial acting as receipts
  detect_data_completeness_issues:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Detect data completeness issues by checking for missing required fields in records.

        Args:
            category: Category to check (e.g., 'Interconnect', 'Production', 'LDC')
            required_fields: List of fields that should be complete (e.g., ['connecting_pipeline', 'connecting_entity'])
            completeness_rule: How to check completeness:
                - 'all_required': ALL listed fields must be present/non-empty
                - 'any_required': At least ONE listed field must be present/non-empty
            filters: Dictionary of additional filters to apply (year, state, etc.)
            max_examples: Maximum number of incomplete record examples to return

        Examples:
            - category='Interconnect', required_fields=['connecting_pipeline', 'connecting_entity'], completeness_rule='all_required'
              → Finds Interconnect records missing BOTH partner fields
            - category='Production', required_fields=['scheduled_quantity'], completeness_rule='all_required'
              → Finds Production records missing quantity data
  detect_entity_duplicates_across_dimensions:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Detect entity duplicates where the same entity combination appears across multiple dimensions.
        - automatically runs separate analysis for each dimension field.

        Args:
            entity_fields: Fields that define the entity (e.g., ['pipeline_name', 'loc_name'])
            dimension_fields: Fields to check for duplicates across (['state_abb', 'county_name'])
            filters: Dictionary of additional filters to apply (year, state, etc.)
            max_examples: Maximum number of duplicate examples to return

        Examples:
            - entity_fields=['pipeline_name', 'loc_name'], dimension_fields=['state_abb', 'county_name']
              → Finds pipeline-location combinations appearing in multiple states AND counties (separate analysis)
            - entity_fields=['connecting_entity'], dimension_fields=['category_short']
              → Finds entities appearing in multiple categories
            - entity_fields=['employee_id'], dimension_fields=['department', 'location']
              → Finds employees in multiple departments AND locations
  filter_and_rank:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Apply filters and rank by specified metric.

        Enhanced with smart duplicate handling:

        Args:
            filters: Dictionary of filters to apply. Common filters:
                - 'year': int (e.g., 2024) - filters by eff_gas_day year
                - 'state': str (e.g., 'PA') - filters by state_abb
                - 'transaction_type': str ('receipts' or 'deliveries') - filters by rec_del_sign
                - 'pipeline': str - filters by pipeline_name
            group_by_column: Column to group by ('connecting_entity', 'pipeline_name', 'state_abb', etc.)
            metric: Aggregation metric ('sum', 'mean', 'count')
            limit: Number of top results to return

        CRITICAL: Always include 'year' filter when user mentions specific years!
  find_consistent_pipelines:
    type: function
    agents: [root_agent]
    params:
      description: Find pipelines with most consistent volumes (always deduplicated for accuracy).
  find_top_state_by_activity:
    type: function
    agents: [root_agent]
    params:
      description: Find the state with the most pipeline activity.
  get_dataset_info:
    type: function
    agents: [root_agent]
    params:
      description: Get comprehensive information about the dataset including schema, statistics, and data quality.
  get_top_locations_by_metric:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Get top locations by specified metric (sum, mean, count) for receipts or deliveries.

        Args:
            year: Year to analyze
            transaction_type: 'receipts' or 'deliveries'
            location_column: Column to group by ('state_abb', 'loc_name', etc.)
            metric: 'sum', 'mean', 'count', or 'average_daily'
            limit: Number of top locations to return
  get_top_pipelines_by_volume:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Get top N pipelines by total volume (always deduplicated for accuracy).

        Args:
            limit: Number of top pipelines to return
  perform_clustering:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Generic clustering tool that groups data by specified dimensions and applies K-Means clustering (always deduplicated for accuracy).

        Args:
            filters: Dictionary of filters to apply (year, pipeline, state, etc.)
            group_by_column: Column to group by ('loc_name', 'connecting_entity', 'pipeline_name', etc.)
            time_aggregation: How to aggregate time ('monthly', 'quarterly', 'weekly')
            n_clusters: Number of clusters for K-Means
            normalize: Whether to normalize the data before clustering

        Returns:
            Dict with cluster assignments, centroids, and analysis metrics
  query_total_volume:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Get total volume for a specific year (always deduplicated for accuracy).

        Args:
            year: Year to filter data (e.g., '2024')

