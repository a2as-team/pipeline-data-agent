[project]
name = "pipeline-data-agent"
version = "0.1.0"
description = "Chat-based data analysis agent using Google ADK and Claude"
authors = [
    {name = "Biplov Bhandari"},
]
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=10.0.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "google-adk>=0.1.0",
    "litellm>=1.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.0.280",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.0.280",
]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
